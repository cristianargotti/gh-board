# The digest GitHub computes for every release asset lets doctor compare
# the installed binary without downloading the checksum file.
query ReleaseAssets($owner: String!, $name: String!, $tag: String!) {
  repository(owner: $owner, name: $name) {
    release(tagName: $tag) {
      tagName
      releaseAssets(first: 100) { nodes { name digest } }
    }
  }
}
