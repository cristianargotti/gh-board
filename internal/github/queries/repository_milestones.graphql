query RepositoryMilestones($owner: String!, $name: String!, $first: Int!, $after: String) {
  repository(owner: $owner, name: $name) {
    milestones(first: $first, after: $after, states: [OPEN], orderBy: { field: DUE_DATE, direction: ASC }) {
      pageInfo { hasNextPage endCursor }
      nodes { id number title state dueOn }
    }
  }
}
